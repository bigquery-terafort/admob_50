name: AdMob Full Sync to BigQuery (Account 4 - admob4_968)

# =============================================================================
#  repo: bigquery-terafort/Admob_4       publisher: pub-9688592152492531
#  path: .github/workflows/admob_sync.yml
#
#  v6.1: sirf EK python file call hoti hai — src/admob_full_sync.py
#        Koi alag plan_chunks.py / dim_health.py nahi. Modes:
#            --plan-chunks   backfill ko chunks mein tode
#            --dim-health    dimension tables khaali to nahi
#            --days N        daily sync
#            --backfill-*    ek chunk
#
#  RUN #107 KYUN MARA — TIMEOUT, SCRIPT KA ERROR NAHI
#    "cancelled in 1h 0m 16s" = GitHub ka timeout-minutes: 60
#    MAAP: 06-05 -> 06-21 = 17 din, ~57 min = ~3.2 min/din
#      pub-5036   13.5K rows/din   0.87 min/din   90 din =  78 min  OK
#      pub-9688   39.0K rows/din   3.20 min/din   90 din = ~290 min FAIL
#    DATA MEHFOOZ RAHA: v6 ka fetch-before-delete chala.
#    0 missing days, 0 duplicate runs (BigQuery se verify kiya).
#
#  RUN #110 KYUN MARA — 0 SECONDS, YAML PARSE ERROR
#    File ke shuru mein markdown note (`> **NOTE:**`) tha. Valid YAML nahi.
#    Ab file `name:` se shuru hoti hai aur koi embedded python heredoc nahi.
#
#  max-parallel: 1 LAZMI — har chunk shuru mein sync_dims chalata hai jo
#  publisher-scoped DELETE+INSERT transaction hai. Parallel chunks usi
#  publisher_id ki rows par takrayenge.
#
#  CANCELLED RUNS admob_sync_log MEIN NAHI AATE — GitHub process ko maar
#  deti hai, `finally: write_log` chalta hi nahi. Monitoring "FAILED rows"
#  nahi, "MISSING runs per publisher per day" dhoondhe.
# =============================================================================

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Daily sync: kitne din (default 3)'
        required: false
        default: '3'
      backfill_start:
        description: 'Backfill start (YYYY-MM-DD) - chunks mein tootega'
        required: false
        default: ''
      backfill_end:
        description: 'Backfill end (YYYY-MM-DD)'
        required: false
        default: ''
      chunk_days:
        description: 'Har chunk kitne din (default 15 - ye account bara hai)'
        required: false
        default: '15'
      dim_shrink_pct:
        description: 'Dim swap se inkaar agar naye rows purane ke is ratio se kam'
        required: false
        default: '0.5'

concurrency:
  group: admob4-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chunks: ${{ steps.build.outputs.chunks }}
      mode: ${{ steps.build.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Plan chunks
        id: build
        env:
          BF_START: ${{ github.event.inputs.backfill_start }}
          BF_END: ${{ github.event.inputs.backfill_end }}
          CHUNK_DAYS: ${{ github.event.inputs.chunk_days || '15' }}
        run: |
          set -euo pipefail
          python src/admob_full_sync.py --plan-chunks

  daily:
    needs: plan
    if: needs.plan.outputs.mode == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-cloud-bigquery

      - name: Run AdMob daily sync
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
          BQ_LOCATION: ${{ secrets.BQ_LOCATION }}
          ADMOB_PUBLISHER_ID: ${{ secrets.ADMOB_PUBLISHER_ID }}
          ADMOB_REPORT_CURRENCY: ${{ secrets.ADMOB_REPORT_CURRENCY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          DIM_SHRINK_PCT: ${{ github.event.inputs.dim_shrink_pct || '0.5' }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '3' }}
        run: |
          set -euo pipefail
          python src/admob_full_sync.py --days "${DAYS_BACK}"

      - name: Verify dimension health
        if: always()
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
          BQ_LOCATION: ${{ secrets.BQ_LOCATION }}
          ADMOB_PUBLISHER_ID: ${{ secrets.ADMOB_PUBLISHER_ID }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
        run: python src/admob_full_sync.py --dim-health

  backfill:
    needs: plan
    if: needs.plan.outputs.mode == 'backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-cloud-bigquery

      - name: Run backfill chunk
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
          BQ_LOCATION: ${{ secrets.BQ_LOCATION }}
          ADMOB_PUBLISHER_ID: ${{ secrets.ADMOB_PUBLISHER_ID }}
          ADMOB_REPORT_CURRENCY: ${{ secrets.ADMOB_REPORT_CURRENCY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          DIM_SHRINK_PCT: ${{ github.event.inputs.dim_shrink_pct || '0.5' }}
          CHUNK_START: ${{ matrix.chunk.start }}
          CHUNK_END: ${{ matrix.chunk.end }}
          CHUNK_IDX: ${{ matrix.chunk.idx }}
        run: |
          set -euo pipefail
          echo "Chunk ${CHUNK_IDX}: ${CHUNK_START} -> ${CHUNK_END}"
          python src/admob_full_sync.py \
            --backfill-start "${CHUNK_START}" \
            --backfill-end "${CHUNK_END}"

      - name: Verify dimension health
        if: always()
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
          BQ_LOCATION: ${{ secrets.BQ_LOCATION }}
          ADMOB_PUBLISHER_ID: ${{ secrets.ADMOB_PUBLISHER_ID }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
        run: python src/admob_full_sync.py --dim-health
