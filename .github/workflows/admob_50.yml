name: AdMob Full Sync to BigQuery

# =============================================================================
#  YE FILE CHAARO ADMOB REPOS MEIN BINA KISI TABDEELI KE LAGTI HAI.
#  Publisher ka farq sirf ADMOB_PUBLISHER_ID secret se aata hai.
#
#  path: .github/workflows/<jo bhi naam ho>.yml
#
#  RUN #129 KYUN MARA — GALAT PATH
#    python: can't open file '.../src/admob_full_sync.py': No such file
#    Har repo ka layout alag hai. Kuch mein script root pe hai, kuch mein
#    src/ ke andar. Hard-coded path chaaro repos mein kaam nahi karta.
#    Aur naam bhi har repo mein alag hai:
#        admob_50   -> src/admob_python.py
#        Admob_4    -> src/admob_full_sync.py
#    → Ab workflow script ko NAAM se nahi, us ke ANDAR ke marker
#      ('admob_unified_fact') se dhoondhti hai. Naam/folder kuch bhi ho,
#      chal jayegi.
#
#  RUN #110 KYUN MARA — 0 SECONDS, YAML PARSE ERROR
#    File ke shuru mein markdown note tha. Ab file `name:` se shuru hoti hai
#    aur YAML ke andar koi embedded python heredoc nahi.
#
#  RUN #107 KYUN MARA — 60-MIN TIMEOUT (Admob_4 / pub-9688)
#    Maap: 17 din ~57 min = ~3.2 min/din. 90 din = ~290 min.
#    → Backfill ab 15-din ke chunks mein. Har chunk ~50 min.
#    DATA MEHFOOZ RAHA: v6 ka fetch-before-delete chala.
#
#  max-parallel: 1 LAZMI — har chunk shuru mein sync_dims chalata hai jo
#  publisher-scoped DELETE+INSERT transaction hai. Parallel chunks usi
#  publisher_id ki rows par takrayenge.
#
#  CANCELLED RUNS admob_sync_log MEIN NAHI AATE — GitHub process ko maar
#  deti hai, `finally: write_log` chalta hi nahi. Monitoring "FAILED rows"
#  nahi, "MISSING runs per publisher per day" dhoondhe.
# =============================================================================

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Daily sync: kitne din (default 3)'
        required: false
        default: '3'
      backfill_start:
        description: 'Backfill start (YYYY-MM-DD) - chunks mein tootega'
        required: false
        default: ''
      backfill_end:
        description: 'Backfill end (YYYY-MM-DD)'
        required: false
        default: ''
      chunk_days:
        description: 'Har chunk kitne din (default 15)'
        required: false
        default: '15'
      dim_shrink_pct:
        description: 'Dim swap se inkaar agar naye rows purane ke is ratio se kam'
        required: false
        default: '0.5'

concurrency:
  group: admob-sync-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chunks: ${{ steps.build.outputs.chunks }}
      mode: ${{ steps.build.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Script top-level par google libraries import karti hai (line 88), is
      # liye --plan-chunks ko bhi ye chahiye — chahe wo credentials use na kare.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-cloud-bigquery

      - name: Plan chunks
        id: build
        env:
          BF_START: ${{ github.event.inputs.backfill_start }}
          BF_END: ${{ github.event.inputs.backfill_end }}
          CHUNK_DAYS: ${{ github.event.inputs.chunk_days || '15' }}
        run: |
          set -euo pipefail
          # Script ko NAAM se nahi, ANDAR ke marker se dhoondho. Chaaro repos
          # mein file ka naam alag hai (admob_python.py / admob_full_sync.py /
          # admob_sync_v5.py) aur folder bhi alag (root ya src/).
          SCRIPT=$(grep -rl 'admob_unified_fact' --include='*.py' . 2>/dev/null | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "::error::AdMob sync script nahi mili (koi .py file mein 'admob_unified_fact' nahi)"
            find . -name '*.py' -not -path './.git/*' | head -20
            exit 1
          fi
          echo "Using script: $SCRIPT"
          python "$SCRIPT" --plan-chunks

  daily:
    needs: plan
    if: needs.plan.outputs.mode == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-cloud-bigquery

      - name: Run AdMob daily sync
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
          BQ_LOCATION: ${{ secrets.BQ_LOCATION }}
          ADMOB_PUBLISHER_ID: ${{ secrets.ADMOB_PUBLISHER_ID }}
          ADMOB_REPORT_CURRENCY: ${{ secrets.ADMOB_REPORT_CURRENCY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          DIM_SHRINK_PCT: ${{ github.event.inputs.dim_shrink_pct || '0.5' }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '3' }}
        run: |
          set -euo pipefail
          SCRIPT=$(grep -rl 'admob_unified_fact' --include='*.py' . 2>/dev/null | head -1)
          echo "Using script: $SCRIPT"
          python "$SCRIPT" --days "${DAYS_BACK}"

      - name: Verify dimension health
        if: always()
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
          BQ_LOCATION: ${{ secrets.BQ_LOCATION }}
          ADMOB_PUBLISHER_ID: ${{ secrets.ADMOB_PUBLISHER_ID }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          SCRIPT=$(grep -rl 'admob_unified_fact' --include='*.py' . 2>/dev/null | head -1)
          python "$SCRIPT" --dim-health

  backfill:
    needs: plan
    if: needs.plan.outputs.mode == 'backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-cloud-bigquery

      - name: Run backfill chunk
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
          BQ_LOCATION: ${{ secrets.BQ_LOCATION }}
          ADMOB_PUBLISHER_ID: ${{ secrets.ADMOB_PUBLISHER_ID }}
          ADMOB_REPORT_CURRENCY: ${{ secrets.ADMOB_REPORT_CURRENCY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          DIM_SHRINK_PCT: ${{ github.event.inputs.dim_shrink_pct || '0.5' }}
          CHUNK_START: ${{ matrix.chunk.start }}
          CHUNK_END: ${{ matrix.chunk.end }}
          CHUNK_IDX: ${{ matrix.chunk.idx }}
        run: |
          set -euo pipefail
          SCRIPT=$(grep -rl 'admob_unified_fact' --include='*.py' . 2>/dev/null | head -1)
          echo "Using script: $SCRIPT"
          echo "Chunk ${CHUNK_IDX}: ${CHUNK_START} -> ${CHUNK_END}"
          python "$SCRIPT" \
            --backfill-start "${CHUNK_START}" \
            --backfill-end "${CHUNK_END}"

      - name: Verify dimension health
        if: always()
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
          BQ_LOCATION: ${{ secrets.BQ_LOCATION }}
          ADMOB_PUBLISHER_ID: ${{ secrets.ADMOB_PUBLISHER_ID }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          SCRIPT=$(grep -rl 'admob_unified_fact' --include='*.py' . 2>/dev/null | head -1)
          python "$SCRIPT" --dim-health
